<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            height: 100vh;
            background: #e3f9ff;
            display: flex;
            align-items: center;
            justify-content: center;
        } 
        .calculator {
            background: #3a4452;
            padding: 20px;
            border-radius: 10px;
        }
        .calculator form input {
            border: 0;
            font-size: 20px;
            width: 60px;
            height: 60px;
            border-radius: 10px;
            box-shadow: -8px -8px 15px rgb(255, 255, 255, 0.1), 5px 5px 15px rgb(0, 0, 0, 0.2);
        }
        .calculator form input:hover {
            background-color: black;
            color: white;
        }
        .display {
            display: flex;
            margin: 20px 0;
        }
        .display input {
            flex: 1;
            font-size: 25px;
            padding: 10px;
        }
        .operator {
            color: rgb(15, 164, 114);
        }
        form .equal {
            width: 125px;
        }
    </style>
</head>
<body>
<div class="container" style="background-color:black;">
    <div class="calculator">
        <form>
            <div class="display">
                <input type="text" name="display" id="display" readonly>
            </div>
            <div>
                <input type="button" value="AC" onclick="clearDisplay()" class="operator">
                <input type="button" value="DE" onclick="deleteLastChar()" class="operator">
                <input type="button" value="." onclick="appendToDisplay('.')" class="operator">
                <input type="button" value="/" onclick="appendToDisplay('/')" class="operator">
            </div>
            <div>
                <input type="button" value="7" onclick="appendToDisplay('7')">
                <input type="button" value="8" onclick="appendToDisplay('8')">
                <input type="button" value="9" onclick="appendToDisplay('9')">
                <input type="button" value="*" onclick="appendToDisplay('*')" class="operator">
            </div>
            <div>
                <input type="button" value="4" onclick="appendToDisplay('4')">
                <input type="button" value="5" onclick="appendToDisplay('5')">
                <input type="button" value="6" onclick="appendToDisplay('6')">
                <input type="button" value="-" onclick="appendToDisplay('-')" class="operator">
            </div>
            <div>
                <input type="button" value="1" onclick="appendToDisplay('1')">
                <input type="button" value="2" onclick="appendToDisplay('2')">
                <input type="button" value="3" onclick="appendToDisplay('3')">
                <input type="button" value="+" onclick="appendToDisplay('+')" class="operator">
            </div>
            <div>
                <input type="button" value="00" onclick="appendToDisplay('00')">
                <input type="button" value="0" onclick="appendToDisplay('0')">
                <input type="button" value="=" onclick="calculate()" class="equal">
            </div>
        </form>
    </div>
</div>

<script>
    function appendToDisplay(value) {
        document.getElementById('display').value += value;
    }

    function clearDisplay() {
        document.getElementById('display').value = '';
    }

    function deleteLastChar() {
        let display = document.getElementById('display');
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        let display = document.getElementById('display');
        try {
            display.value = eval(display.value); 
        } catch (e) {
            display.value = 'Error';
        }
    }
</script>
</body>
</html>
